<!-- 할 일 관리 앱의 데스크톱 화면 구조 (왼쪽 진행률·카테고리 사이드바, 오른쪽 입력과 목록) -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <!-- 사이드바 진행률 (F6, F7)과 카테고리 메뉴 (F5) -->
    <aside class="sidebar">
      <h1 class="app-title">오늘 할 일</h1>

      <section class="progress" aria-label="진행률">
        <p class="progress-total"><strong id="progress-done">0</strong><span id="progress-detail">/0 완료 · 0%</span></p>
        <div class="meter" role="img" aria-label="업무 0/0, 개인 0/0, 공부 0/0 완료">
          <span class="seg seg-work" style="--total: 1; --done: 0%"><i></i></span>
          <span class="seg seg-life" style="--total: 1; --done: 0%"><i></i></span>
          <span class="seg seg-study" style="--total: 1; --done: 0%"><i></i></span>
        </div>
      </section>

      <nav class="tabs" aria-label="카테고리 필터">
        <button type="button" data-filter="전체" aria-pressed="true"><span class="dot dot-all"></span>전체</button>
        <button type="button" class="legend-work" data-filter="업무" aria-pressed="false"><span class="dot"></span>업무 <span class="count">0/0</span></button>
        <button type="button" class="legend-life" data-filter="개인" aria-pressed="false"><span class="dot"></span>개인 <span class="count">0/0</span></button>
        <button type="button" class="legend-study" data-filter="공부" aria-pressed="false"><span class="dot"></span>공부 <span class="count">0/0</span></button>
      </nav>
    </aside>

    <main class="main">
      <!-- 입력 영역 (F1) -->
      <form class="add" autocomplete="off">
        <label class="visually-hidden" for="new-title">새 할 일</label>
        <input id="new-title" class="add-title" type="text" placeholder="새 할 일을 입력하세요">
        <label class="visually-hidden" for="new-category">카테고리</label>
        <select id="new-category" class="add-category">
          <option>업무</option>
          <option>개인</option>
          <option>공부</option>
        </select>
        <button class="add-button" type="submit">추가</button>
        <p id="auto-hint" class="add-hint" aria-live="polite"></p>
      </form>

      <!-- 할 일 목록 -->
      <ul class="todo-list"></ul>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
