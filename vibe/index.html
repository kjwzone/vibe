<!-- 입력한 글의 글자 수를 버튼으로 세어 보여 주는 한 페이지짜리 도구 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글자 수 세기</title>
  <style>
    :root { --green: #03c75a; --green-dark: #02a84c; --text: #222; --muted: #767678; --line: #e4e8eb; }
    body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: var(--text); background: #fff;
           max-width: 640px; margin: 0 auto; padding: 0 16px; text-align: center; }
    h1 { margin: 88px 0 28px; font-size: 40px; font-weight: 800; letter-spacing: -1px; color: var(--green); }
    .searchbox { border: 2px solid var(--green); border-radius: 8px; background: #fff; text-align: left;
                 box-shadow: 0 2px 8px rgba(3, 199, 90, 0.12); }
    .searchbox:focus-within { border-color: var(--green-dark); box-shadow: 0 2px 12px rgba(3, 199, 90, 0.3); }
    textarea { display: block; width: 100%; height: 160px; box-sizing: border-box; padding: 16px 18px; border: 0;
               outline: 0; resize: vertical; font: inherit; font-size: 17px; color: var(--text); background: transparent; }
    textarea::placeholder { color: #b0b3b8; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px;
               border-top: 1px solid var(--line); }
    .toolbar label { margin-right: auto; font-size: 14px; color: var(--muted); }
    .toolbar input { width: 80px; margin-left: 6px; padding: 6px 8px; border: 1px solid var(--line);
                     border-radius: 4px; font: inherit; font-size: 14px; }
    .toolbar input:focus { outline: 0; border-color: var(--green); }
    button { padding: 9px 18px; border-radius: 4px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
    #count-btn { border: 1px solid var(--green); background: var(--green); color: #fff; }
    #count-btn:hover { background: var(--green-dark); border-color: var(--green-dark); }
    #clear-btn, #copy-btn { border: 1px solid var(--line); background: #fff; color: var(--muted); }
    #clear-btn:hover, #copy-btn:hover { border-color: var(--muted); color: var(--text); }
    #clear-btn:disabled, #copy-btn:disabled { opacity: 0.45; cursor: not-allowed; border-color: var(--line); color: var(--muted); }
    button:focus-visible { outline: 2px solid var(--green-dark); outline-offset: 2px; }
    /* 6열 격자에서 글자 수 2장(각 3칸), 단어·단락·문장 3장(각 2칸), Byte 2장(각 3칸)으로 배치한다. */
    #result { margin-top: 28px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
    .stat { grid-column: span 2; padding: 14px 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .stat:nth-child(-n+2), .stat:nth-child(n+6) { grid-column: span 3; }
    .stat-label { font-size: 13px; color: var(--muted); }
    .stat-num { margin-top: 6px; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; word-break: break-all; }
    .over { color: red; }
    /* 좁은 화면에서는 카드 글자를 줄이고, 버튼을 한 줄에 모은다. */
    @media (max-width: 480px) {
      .stat-label { font-size: 12px; }
      .stat-num { font-size: 19px; }
      .toolbar label { flex-basis: 100%; }
      button { padding: 9px 12px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <h1>글자 수 세기</h1>
  <div class="searchbox">
    <textarea id="input" placeholder="여기에 글을 적어 주세요."></textarea>
    <div class="toolbar">
      <label>제한 글자 수 <input id="limit" type="number" min="0" placeholder="예: 100"></label>
      <button id="copy-btn" disabled>복사하기</button>
      <button id="clear-btn" disabled>전체 지우기</button>
      <button id="count-btn">글자 수 세기</button>
    </div>
  </div>
  <div id="result"></div>

  <script>
    function updateCount() {
      var text = document.getElementById('input').value;
      // 이모지 같은 특수 문자도 한 글자로 세기 위해 배열로 펼쳐서 센다.
      var withSpace = Array.from(text).length;
      var withoutSpace = Array.from(text.replace(/\s/g, '')).length;
      // 공백·줄바꿈으로 나눈 덩어리 중 빈 것은 빼고 단어 수로 센다.
      var words = text.split(/\s+/).filter(Boolean).length;
      // 비어 있지 않은 줄을 단락으로 센다.
      var paragraphs = text.split(/\n+/).filter(function (p) { return p.trim(); }).length;
      // 마침표·물음표·느낌표 뒤에 공백이나 끝이 오거나 줄이 바뀌면 문장이 끝난 것으로 센다.
      var sentences = text.split(/[.!?…]+(?:\s+|$)|\n+/).filter(function (s) { return s.trim(); }).length;
      // 한글은 한 글자당 2바이트, 그 외 문자는 1바이트로 센다.
      function countBytes(s) {
        return Array.from(s).reduce(function (sum, ch) {
          return sum + (/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(ch) ? 2 : 1);
        }, 0);
      }
      var bytesWithSpace = countBytes(text);
      var bytesWithoutSpace = countBytes(text.replace(/\s/g, ''));
      // 입력이 비어 있으면 복사·지우기 버튼을 쓸 수 없게 한다.
      document.getElementById('copy-btn').disabled = !text;
      document.getElementById('clear-btn').disabled = !text;
      var limit = parseInt(document.getElementById('limit').value, 10);
      // 지표 하나를 카드로 만든다. checkLimit이 true이고 제한을 넘으면 숫자를 빨갛게 한다.
      function makeCard(label, n, checkLimit) {
        var over = checkLimit && !isNaN(limit) && n > limit;
        return '<div class="stat"><div class="stat-label">' + label + '</div>' +
          '<div class="stat-num' + (over ? ' over' : '') + '">' + n.toLocaleString('ko-KR') + '</div></div>';
      }
      document.getElementById('result').innerHTML =
        makeCard('글자 수 (공백 포함)', withSpace, true) +
        makeCard('글자 수 (공백 제외)', withoutSpace, true) +
        makeCard('단어 수', words, false) +
        makeCard('단락 수', paragraphs, false) +
        makeCard('문장 수', sentences, false) +
        makeCard('Byte (공백 포함)', bytesWithSpace, false) +
        makeCard('Byte (공백 제외)', bytesWithoutSpace, false);
    }
    document.getElementById('count-btn').addEventListener('click', updateCount);
    document.getElementById('input').addEventListener('input', updateCount);
    function copyText() {
      var input = document.getElementById('input');
      var btn = document.getElementById('copy-btn');
      function showCopied() {
        btn.textContent = '복사됨';
        setTimeout(function () { btn.textContent = '복사하기'; }, 1500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(input.value).then(showCopied);
      } else {
        input.select();
        document.execCommand('copy');
        showCopied();
      }
    }
    document.getElementById('copy-btn').addEventListener('click', copyText);
    document.getElementById('clear-btn').addEventListener('click', function () {
      document.getElementById('input').value = '';
      updateCount();
    });
    document.getElementById('limit').addEventListener('input', updateCount);
    // 처음 열었을 때도 0이 들어간 카드를 보여 준다.
    updateCount();
  </script>
</body>
</html>
