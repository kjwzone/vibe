name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: counter 폴더의 index.html만 배포 폴더로 복사
        run: |
          mkdir -p _site/counter
          cp vibe/counter/index.html _site/counter/index.html
      - name: 우면산 호서 천문대의 실행 파일과 출처만 배포 폴더로 복사
        run: |
          mkdir -p _site/hoseo-observatory
          cp -r vibe/hoseo-observatory/{index.html,style.css,js,vendor,sounds,images,CREDITS.md} _site/hoseo-observatory/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
